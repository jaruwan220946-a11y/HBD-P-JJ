<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Project 🎂</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #4a4a4a;
        }

        /* ส่วนข้อความ */
        #text-above {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            height: 50px; /* ล็อกความสูงไว้ไม่ให้ดันกล่อง */
            color: #ff4d6d;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* โซนการแสดงผลหลัก */
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* สไตล์กล่องของขวัญ / เค้ก / รูปภาพ */
        .display-item {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }
        .display-item:hover {
            transform: scale(1.05);
        }
        
        /* สไตล์รูปภาพเจ้าของวันเกิด */
        #birthday-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 5px solid #fff;
            display: none;
        }

        /* ส่วนปุ่ม */
        .btn-container {
            margin-top: 20px;
            height: 50px;
        }
        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.2s;
            display: none;
        }
        button:hover {
            background-color: #ff758f;
            transform: translateY(-2px);
        }

        /* ข้อความอวยพรตอนท้าย */
        #blessing-text {
            display: none;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 20px;
            white-space: pre-line; /* เว้นบรรทัดตามที่พิมพ์ใน JS */
            color: #c71585;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <!-- นำเข้าฟอนต์ Google Font เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ข้อความด้านบน -->
    <div id="text-above"> เปิดๆ </div>

    <!-- พื้นที่แสดงกล่อง / เค้ก / รูปภาพ -->
    <div class="container">
        <!-- ใช้ Emoji แทนชั่วคราว สามารถเปลี่ยนเป็นรูปภาพเองได้ภายหลัง -->
        <div id="main-display" class="display-item" onclick="openGift()">🎁</div>
        <img id="birthday-img" src="https://via.placeholder.com/300" alt="Birthday Person">
    </div>

    <!-- ส่วนปุ่มด้านล่าง -->
    <div class="btn-container">
        <button id="ready-btn" onclick="startCountdown()">พร้อม!</button>
    </div>

    <!-- ข้อความอวยพร -->
    <div id="blessing-text"></div>

    <!-- เสียงเพลง HBD (ใส่ URL ลิงก์เพลงของคุณที่นี่) -->
    <audio id="hbd-music" src="hbd.mp3" loop></audio>

    <script>
        const textAbove = document.getElementById('text-above');
        const mainDisplay = document.getElementById('main-display');
        const birthdayImg = document.getElementById('birthday-img');
        const readyBtn = document.getElementById('ready-btn');
        const blessingText = document.getElementById('blessing-text');
        const hbdMusic = document.getElementById('hbd-music');

        // ลำดับที่ 1: คลิกเปิดกล่องของขวัญ
        function openGift() {
            // เช็คว่าอยู่ในสถานะกล่องของขวัญไหม เพื่อกันกดซ้ำ
            if (mainDisplay.textContent === '🎁') {
                // เล่นเพลง HBD
                hbdMusic.play().catch(error => console.log("Audio play blocked by browser. Click interacting solved it."));
                
                // เปลี่ยนเป็นเค้กจุดเทียน
                mainDisplay.textContent = '🎂'; 
                
                // แสดงข้อความ "อธิษฐานก่อนจิ"
                textAbove.textContent = 'อธิษฐานก่อนจิ 🙏✨';
                
                // นับเวลา 5 วินาที
                setTimeout(() => {
                    textAbove.textContent = 'พร้อมเป่าเค้กยางงง? 😚';
                    readyBtn.style.display = 'block'; // แสดงปุ่มพร้อม
                }, 5000);
            }
        }

        // ลำดับที่ 2: คลิกปุ่มพร้อม เพื่อเริ่มนับถอยหลังเป่าเค้ก
        function startCountdown() {
            readyBtn.style.display = 'none'; // ซ่อนปุ่ม
            textAbove.textContent = 'เป่าเค้กกัน! 🕯️';
            
            let timeLeft = 10;
            
            // สร้างเลขนับถอยหลังแสดงต่อท้ายข้อความ
            const countdownInterval = setInterval(() => {
                textAbove.textContent = `เป่าเค้กกัน! (${timeLeft} วินาที)`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(countdownInterval);
                    finishCake(); // เมื่อครบ 10 วินาที ให้จบขั้นตอน
                }
            }, 1000);
        }

        // ลำดับที่ 3: เทียนดับ และแสดงรูปพร้อมคำอวยพร
        function finishCake() {
            // เปลี่ยนเค้กเป็นแบบไม่มีเทียน (หรือดับเทียน) ในที่นี้เปลี่ยนเป็นรูปภาพแทนตามโจทย์
            mainDisplay.style.display = 'none'; 
            
            // ใส่ Link รูปภาพจริงของคุณที่นี่
            birthdayImg.src = 'picpjj.jpg'; // รูปสุ่มจากเน็ต เปลี่ยนเป็นรูปเพื่อนได้เลย
            birthdayImg.style.display = 'block';
            
            // แสดงคำอวยพร
            textAbove.textContent = '🎉 Happy Birthday! 🎉';
            blessingText.innerHTML = `สุขสันต์วันเกิดนะมีความสุขมากๆ 💖<br>ขอให้ปีนี้เป็นปีที่ดี คิดสิ่งใดก็สมปรารถนา<br>สุขภาพแข็งแรง ร่ำรวยเงินทองน้าาา! ✨`;
            blessingText.style.display = 'block';
        }
    </script>
</body>
</html>
