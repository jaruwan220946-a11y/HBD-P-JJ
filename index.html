<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #000000;
        }

        #text-above {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            height: 50px;
            color: #000000;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .container {
            position: relative;
            width: 320px;
            min-height: 320px;
            display: flex;
            flex-direction: column; /* เปลี่ยนเป็นแนวตั้งเพื่อจัดรูปภาพและเค้กเล็ก */
            align-items: center;
            justify-content: center;
        }

        .display-item {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s;
            user-select: none;
        }
        .display-item:hover {
            transform: scale(1.05);
        }
        
        /* สไตล์รูปภาพเจ้าของวันเกิด */
        #birthday-img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 5px solid #fff;
            display: none;
            margin-bottom: 15px; /* เว้นระยะห่างด้านล่างสำหรับใส่เค้ก GIF */
        }

        /* สไตล์ของเค้ก GIF อันเล็กที่จะอยู่ใต้รูป */
        #small-cake-gif {
            width: 100px;
            height: auto;
            display: none;
        }

        .btn-container {
            margin-top: 20px;
            height: 50px;
            z-index: 10;
        }
        button {
            padding: 10px 25px;
            font-size: 1.2rem;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.2s;
            display: none;
        }
        button:hover {
            background-color: #ff758f;
            transform: translateY(-2px);
        }

        #blessing-text {
            display: none;
            font-size: 1.5rem;
            text-align: center;
            margin-top: 20px;
            white-space: pre-line;
            color: #c71585;
            animation: fadeIn 1.5s ease-in-out;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- เรียกใช้สคริปต์ทำเปเปอร์ชูท (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="text-above">เปิดๆๆๆ</div>

    <div class="container">
        <!-- แสดงกล่องของขวัญตอนเริ่ม -->
        <div id="main-display" class="display-item" onclick="openGift()"><img src="gifttt.gif" style="width:200px; height:auto;"></div>
        
        <!-- รูปภาพเจ้าของวันเกิด -->
        <img id="birthday-img" src="picpjj.jpg" alt="Birthday Person">
        
        <!-- เค้ก GIF อันเล็กใต้รูปภาพ -->
        <img id="small-cake-gif" src="pinkcake.jpg" alt="Mini Cake">
    </div>

    <div class="btn-container">
        <button id="ready-btn" onclick="startCountdown()">พร้อม!</button>
    </div>

    <div id="blessing-text"></div>

    <audio id="hbd-music" src="hbd.mp3" loop></audio>

    <script>
        const textAbove = document.getElementById('text-above');
        const mainDisplay = document.getElementById('main-display');
        const birthdayImg = document.getElementById('birthday-img');
        const smallCakeGif = document.getElementById('small-cake-gif');
        const readyBtn = document.getElementById('ready-btn');
        const blessingText = document.getElementById('blessing-text');
        const hbdMusic = document.getElementById('hbd-music');

        // ลำดับที่ 1: คลิกเปิดกล่องของขวัญ
        function openGift() {
            if (mainDisplay.innerHTML === '<img src="gifttt.gif" style="width:200px; height:auto;">') {
                hbdMusic.play().catch(error => console.log("Audio play blocked"));
                
                // เปลี่ยนเป็นไฟล์เค้กตอนจุดไฟ (ใช้ไฟล์ GIF ของคุณแทนได้เลย)
                mainDisplay.innerHTML = '<img src="cakegif.gif" style="width:200px; height:auto;">'; 
                
                textAbove.textContent = 'อธิษฐานเร็ววว✨';
                
                setTimeout(() => {
                    textAbove.textContent = 'พร้อมเป่าเค้กยางงง?';
                    readyBtn.style.display = 'block';
                }, 5000);
            }
        }

        // ลำดับที่ 2: คลิกปุ่มพร้อม เพื่อเริ่มนับถอยหลัง 10 วินาที
        function startCountdown() {
            readyBtn.style.display = 'none';
            
            let timeLeft = 10;
            const countdownInterval = setInterval(() => {
                textAbove.textContent = `เป่าเค้กกัน! (${timeLeft} วินาที) 🕯️`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(countdownInterval);
                    finishCake(); 
                }
            }, 1000);
        }

        // ลำดับที่ 3: ดับเทียน ยิงเปเปอร์ชูท แสดงรูปและคำอวยพร
        function finishCake() {
            // ซ่อนเค้กหลักก้อนโต
            mainDisplay.style.display = 'none'; 
            
            // แสดงรูปภาพเจ้าของวันเกิด และเค้ก GIF อันเล็กด้านล่างรูปภาพ
            birthdayImg.style.display = 'block';
            smallCakeGif.style.display = 'block'; // เค้กเล็กทำงานที่นี่!
            
            // เปลี่ยนข้อความและแสดงคำอวยพร
            textAbove.textContent = '🎉 เพี้ยงงง! 🎉';
            blessingText.innerHTML = `HAPPY BIRTHDAY KUB 💖<br>มีความสุขมากๆค้าบพี่<br>ขอให้เป็นปีที่ดีน้า คิดสิ่งใดก็ขอให้สมปราถนาค้าบ อิอิ! ✨`;
            blessingText.style.display = 'block';

            // เรียกใช้ฟังก์ชันเปเปอร์ชูท (ยิงพรั่งพรูต่อเนื่อง)
            shootConfetti();
        }

        // ฟังก์ชันสร้างลูกเล่นเปเปอร์ชูท (ยิงจากซ้ายและขวาพร้อมกันให้ดูอลังการ)
        function shootConfetti() {
            var duration = 4 * 1000; // ให้เปเปอร์ชูทยิงต่อเนื่องเป็นเวลา 4 วินาที
            var end = Date.now() + duration;

            (function frame() {
                // ยิงจากฝั่งซ้าย
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 }
                });
                // ยิงจากฝั่งขวา
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
